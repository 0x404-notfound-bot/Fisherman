name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pygame pyinstaller
      - run: pyinstaller --onefile --windowed --add-data "bobber.png;." --add-data "catching.gif;." Fisherman.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fisherman-exe
          path: dist/Fisherman.exe
